<!DOCTYPE html>
  <link href="style.css" rel="stylesheet" type="text/css" />
  <script defer src="navigation.js"></script>

<body>

  <!-- replicate ipod screen -->
  <div class="screen">
      <iframe id="ipod-screen" src="home.html" allowfullscreen></iframe>
  </div>
  
  <!-- click wheel/navigation bar -->
  <div class="click-wheel">

      <button class="button top" onclick ="navigate('contact.html')">Contact</button>
      <button class="button left" onclick="navigate('about-me.html')">About</button>
      <button class="button right" onclick="navigate('projects.html')">projects</button>
      <button class="button bottom" onclick="navigate('home.html')">home</button>
      <button class="center-btn" id="center-btn" onclick="toggleFullscreen()" aria-label="Toggle fullscreen"></button>

  </div>

</body>
</html>
